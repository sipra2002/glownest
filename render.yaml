        value: production
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_IaDWd2h1ECwN@ep-patient-frost-azlyyi55-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
